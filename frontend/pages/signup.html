<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | MediTrial AI</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--medical-blue:#0D3B66;
--medical-blue-dark:#092A4A;
--accent-gradient:linear-gradient(90deg,#4F46E5,#3B82F6);
--bg-dark:#0B1020;
--card-bg:#111827;
}

html,body{
margin:0;
padding:0;
background:var(--bg-dark);
font-family:'Inter',sans-serif;
color:#fff;
}

body{
display:flex;
flex-direction:column;
min-height:100vh;
}

.auth-container{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:40px;
background: radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.05), transparent 400px),
            radial-gradient(circle at top left, rgba(79, 70, 229, 0.05), transparent 400px);
}

.auth-card{
background:var(--card-bg);
border-radius:18px;
padding:60px 40px;
width:100%;
max-width:440px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
border: 1px solid rgba(255,255,255,0.05);
}

.brand-title{
font-family:'DM Serif Display',serif;
font-size:2.3rem;
text-align:center;
line-height: 1.1;
}

.brand-title span{
display:block;
font-style:italic;
background:var(--accent-gradient);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

.form-label{
font-size:.75rem;
letter-spacing:.1em;
text-transform:uppercase;
color:#9CA3AF;
font-weight:600;
}

.form-control{
background:#1E293B;
border:1px solid #1E293B;
border-radius:12px;
padding:14px 18px;
color:#fff;
}

.form-control:focus{
border-color:#3B82F6;
box-shadow:0 0 0 3px rgba(59,130,246,.2);
background: #1E293B;
color:#fff;
}

.password-wrapper{
position:relative;
}

.password-wrapper i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#9CA3AF;
z-index: 5;
}

.btn-primary{
background:var(--medical-blue);
border:none;
padding:14px;
border-radius:50px;
font-weight:600;
transition: 0.3s ease;
}

.btn-primary:hover{
background:var(--medical-blue-dark);
transform: translateY(-2px);
}

</style>
</head>

<body>

<div class="auth-container">
<div class="auth-card">

<div class="mb-5 text-center">
<h1 class="brand-title">
Clinical Intelligence
<span>Accelerated.</span>
</h1>
<p class="mt-3 text-secondary small">
Create your professional access profile.
</p>
</div>

<div id="signupError" class="alert alert-danger d-none small mb-4 py-2"></div>

<form id="signupForm">

<div class="mb-4">
<label class="form-label" for="full_name">Full Professional Name</label>
<input type="text" id="full_name" class="form-control" placeholder="Dr. Alexandra Smith" required autocomplete="name">
</div>

<div class="mb-4">
<label class="form-label" for="email">Institutional Email</label>
<input type="email" id="email" class="form-control" placeholder="alex@hospital.org" required autocomplete="email">
</div>

<div class="mb-4">
<label class="form-label d-flex justify-content-between align-items-center" for="password">
<span>Secure Password</span>
<i class="fas fa-info-circle text-info"
   data-mdb-toggle="tooltip"
   title="Minimum 7 characters. Include 1 uppercase, 1 number, and 1 special symbol."></i>
</label>

<div class="password-wrapper">
<input type="password" id="password" class="form-control" placeholder="••••••••••" required autocomplete="new-password">
<i class="fas fa-eye" onclick="togglePassword(event)"></i>
</div>
</div>

<button type="submit" class="btn btn-primary w-100 mt-3">
Initialize Profile
</button>

</form>

<div class="text-center mt-4 small text-secondary">
Already registered? <a href="/login" class="text-info fw-bold text-decoration-none">Sign in here</a>
</div>

</div>
</div>

<clinical-footer></clinical-footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>

<script>
if (typeof mdb !== 'undefined' && mdb.Tooltip) {
    const tooltipTriggerList=[...document.querySelectorAll('[data-mdb-toggle="tooltip"]')];
    tooltipTriggerList.map(t=>new mdb.Tooltip(t));
}

function togglePassword(event){
const input=document.getElementById("password");
const icon=event.currentTarget;
if(input.type==="password"){
input.type="text";
icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");
}else{
input.type="password";
icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");
}
}
</script>

</body>
</html>
